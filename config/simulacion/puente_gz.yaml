# =============================================================================
# puente_gz.yaml — Tópicos que pasan entre Gazebo y ROS 2 (ros_gz_bridge)
# -----------------------------------------------------------------------------
# Lo usa scripts/simulacion/simulacion.launch.py (parameter_bridge con config_file).
#   GZ_TO_ROS: de Gazebo a ROS 2 · ROS_TO_GZ: de ROS 2 a Gazebo
# =============================================================================
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
# Nube del LiDAR simulado (gpu_lidar publica <topic>/points)
- ros_topic_name: "/lidar/points"
  gz_topic_name: "/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
# Odometría exacta del robot simulado y su transformada odom -> base_footprint
- ros_topic_name: "/odom"
  gz_topic_name: "/model/r1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
- ros_topic_name: "/tf"
  gz_topic_name: "/model/r1/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
# Velocidades que salen de Nav2 (collision_monitor) hacia el robot simulado
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/r1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
